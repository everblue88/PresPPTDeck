name: PresPPTDeck
version: 0.2.0
description: AI职场汇报顾问 — 通过12步方法论，从业务理解到汇报交付的完整闭环

category:
  - productivity
  - presentation
  - business
  - ai-skill

capabilities:
  - business_analysis        # 业务分析：理解汇报对象、目的、关注点
  - logical_framework        # 逻辑构建：WHY→WHAT→HOW→RESULT→NEXT故事线
  - presentation_design      # 视觉设计：配色、字体、图标、布局
  - visual_modeling          # 视觉模型：金字塔、流程图、Dashboard等12种
  - ppt_generation           # PPT生成：python-pptx代码生成器
  - presentation_coaching    # 汇报演练：演讲稿、Q&A准备、技巧指导

workflow:
  - discover                 # 第一阶段：业务理解（Step 1-3）
  - framework                # 第二阶段：逻辑构建（Step 4-5）
  - visualize                # 第三阶段：视觉设计（Step 6-8）
  - deliver                  # 第四阶段：制作交付（Step 9-12）

templates:
  - annual_review            # 年度述职模板
  - product_strategy         # 产品策略模板
  - project_report           # 项目汇报模板
  - proposal                 # 方案评审模板
  - strategic_planning       # 战略规划模板

design_styles:
  - tech_blue                # 科技蓝白
  - finance_gold             # 金融黑金
  - minimal_white            # 极简白灰
  - dark_tech                # 深色科技
  - vibrant_orange           # 活力橙红

output_formats:
  - markdown
  - pptx
  - html
  - png
  - pdf
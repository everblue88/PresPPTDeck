name: PresPPTDeck
version: 0.4.0
description: Consulting-grade PPT 生产系统 — 1+4 多 Agent 架构（Logic / Content / Visual / QA）

architecture: 1+4
  # 1 个全局宪法 + 4 个职责分离的 Agent

category:
  - productivity
  - presentation
  - business
  - ai-skill

constitution:
  - constitution/GLOBAL_CONSTITUTION.md

agents:
  - agents/01_LOGIC_ARCHITECT.md      # 讲什么 → Storyline
  - agents/02_CONTENT_STRATEGIST.md   # 凭什么 → Evidence
  - agents/03_VISUAL_DESIGNER.md      # 怎么画 → Layout/Visual
  - agents/04_PARTNER_QA.md           # 能否交付 → PASS/REWORK

workflow:
  - framework/12STEP_WORKFLOW.md      # 12 步编排工作流

patterns:
  - cover, executive-summary
  - framework, pyramid, layer, issue-tree, capability-map
  - process, timeline, roadmap, funnel
  - comparison, before_after, matrix, decision-matrix
  - dashboard, evidence-chain
  - governance-model, operating-model, architecture, closed-loop, case_card

visual:
  - visual/color-system.md
  - visual/typography.md
  - visual/grid-system.md
  - visual/icon-system.md
  - visual/diagram-rules.md

qa:
  - qa/logic-checklist.md
  - qa/content-checklist.md
  - qa/visual-checklist.md
  - qa/partner-review.md

output_formats:
  - pptx
  - html
  - markdown